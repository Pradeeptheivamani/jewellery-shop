<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Golden Shine Jewellery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8e1;
        }
        header {
            background-color: #8d6e63;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background-color: #d7ccc8;
            padding: 10px;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #4e342e;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            border: 1px solid #ccc;
            width: 220px;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .card button {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #8d6e63;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 3px;
        }
        footer {
            background-color: #4e342e;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Golden Shine Jewellery</h1>
    <p>Pure Gold • Elegant Designs</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Necklaces</a>
    <a href="#">Rings</a>
    <a href="#">Earrings</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2 style="text-align:center;">Our Collection</h2>
    <div class="products">
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Necklace">
            <h3>Gold Necklace</h3>
            <p>₹45,000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Ring">
            <h3>Diamond Ring</h3>
            <p>₹30,000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Earrings">
            <h3>Gold Earrings</h3>
            <p>₹20,000</p>
            <button>Buy Now</button>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Golden Shine Jewellery | Contact: 98765 43210</p>
</footer>

</body>
</html>
